block.gr-dummy.name = 测试墙
block.gr-dummy.description = 测试用墙。尽情释放你的怒火吧！\n\n[red]点击以切换队伍[]

block.gr-grid.name = 栅格墙
block.gr-grid.description = 精炼废料墙的小型变体。\n不会因耐久度降低而受损，但总生命值较低。

block.gr-insulated-wall.name = 绝缘墙
block.gr-insulated-wall.description = 基础防御墙体。能阻挡敌方炮弹，电弧和激光。

block.gr-pillar.name = 天塔柱
block.gr-pillar.description = 向上投射力场，阻止任何非友方单位飞越。\n[salmon]- 易爆

block.gr-refined-scrap-barracade.name = 精炼废料墙
block.gr-refined-scrap-barracade.description = 廉价的可消耗墙体。\n抵御敌方子弹、电弧和激光，拥有不错的护甲，能被快速建造。\n[accent]半耐久时受损[]，失去激光和电弧吸收能力及护甲。

block.gr-reflectum-wall.name = 反射墙

block.gr-regen-barracade.name = 再生壁垒
block.gr-regen-barracade.description = 类似于绝缘墙，能够吸收激光，但无法吸收电弧。\n[accent]- 会缓慢恢复生命值

block.gr-reinforced-structure.name = 再生墙
block.gr-reinforced-structure.description = 受到伤害时，将部分伤害转化为治疗量，治疗周围的建筑[lightgrey](包括自身)[]\n\n[green]- 无需电力\n- 能够抵抗治疗压制，受到治疗压制时治疗效果降低\n\n[salmon]- 受到伤害增加

block.gr-reinforced-thorium-wall.name = 强化钍墙
block.gr-reinforced-thorium-wall.description = 能够释放辐射脉冲，削弱附近的敌人。

block.gr-scrap-piled-barracade.name = 废料堆墙

block.gr-titanium-barracade.name = 钛墙
block.gr-titanium-barracade.description = 基础防御墙体，阻挡敌方炮弹。

