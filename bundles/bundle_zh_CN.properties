##SECTORS
sector.gr-aftermath.name = 余波
sector.gr-aftermath.description = 一个生产场地的遗迹。\n场地的部分区域仍然基本完好，尽管幸存的核心已[red]失去[]建造光伏板的能力\n\n[accent]保护剩余的光伏板，并消灭剩余敌军势力

sector.gr-gier-main.name = 基尔[grey]<小行星带>[]
sector.gr-gier-main.description = 一个由小行星组成的破碎空间，每次游戏的地图都是随机的。(所以运气不好可以多重开几次)

sector.gr-fragmented-fix.name = 分裂谷
sector.gr-fragmented-fix.description = Exogen占领着此星球。\n开始收集资源，向前推进。[tan] 通关解锁：[]\n- 控制台方块\n- 第二枚数据芯片

sector.gr-trench.name = 破碎沟壑
sector.gr-trench.description = 该区块光照极少，存在多处被封闭的矿脉区域。\n[accent]< 请使用无人机平台 >

sector.gr-hedge.name = 冲击遗址
sector.gr-hedge.description = [accent]该区块位于Derium深度层(详见区块数据芯片)，因此光线相当昏暗。\n[accent]光伏板[]已被替换为[accent]热能引擎[]，且建造成本相当高昂。[red]尽量避免热能引擎损毁，因为它们同样非常易爆[]\n[lightgrey]本区块可使用硅科技\n[accent]利用热能引擎和硅科技消灭大规模敌军攻势

sector.gr-intercept.name = 伏击
sector.gr-intercept.description = 附近存在一座敌方基地。此处可使用硅相关的科技。\n\n[accent]尽快建立防御工事[]。

sector.gr-production-site.name = 生产工地
sector.gr-production-site.description = [grey]<支线区块>[]\n本区块无敌人威胁\n\n[accent]恭喜你被录用成为了一名MDT打工人！[]\n[lightgrey]着陆该区块以获得更多信息

sector.gr-radiance.name = 光辉
sector.gr-radiance.description = 一个靠近地表位置的采矿场。\n[accent]<该区块存在生物威胁>\n<请使用修复塔台>

##SECTOR TEXT
# intercept
intercept.warn: [red]警告[]\n该区大多数资源矿脉已枯竭。\n 保护剩余矿脉，并在此立足。

intercept.objective1: 侦测到正在接近的[accent]衰变[]
intercept.objective2: 侦测到正在接近的[accent]瓦解[]

intercept.time: [red]敌军将在[]{0}[]后抵达
intercept.time2: [accent]火花将在[]{0}[]后抵达
intercept.time3: [accent]壁垒将在[]{0}[]后抵达
intercept.time4: [red]最终波次将在[]{0}[]后抵达

intercept.note2:[accent]<城塞核心>\nID#：182\n\n[]近期敌方信号扫描显示附近有基地。\n\n[grey]Gen：6\n位置：61号区块

# production-site
production-site.timer = [accent]剩余时间：[]{0}
production-site.help = [grey]本区块没有敌人\n[]在规定时间内生产所需的资源\n\n[red]未能完成将导致任务失败\n[accent]放置一个机械钻机以开始\n\n[lightgrey]提醒：开始前请查看你可使用的建筑

# aftermath
aftermath.warn = 该场地因频繁攻击而近期沦陷。\n尽管场地的部分区域仍基本完好并可运作，但核心已经受损，[red]失去了[]建造光伏板的能力\n\n[accent]保护剩余的光伏板，消灭残存敌军

# hedge
hedge.warn = [red]>>深度警告<<[]\n\n该区块位于[accent]Derium[]\n深度层（[lightgrey]- 距海平面12KM[]）\n在此深度下[accent]光伏板[]无法有效提供能量，因此已被替换为[accent]热能引擎[]。\n[accent]热能引擎[]是该场地原有的能量来源，（[lightgray]在事故之前[]）\n[red]热能引擎相当昂贵，请尽量避免损失[]

# radiance
radiance.note = 该区块存在一种名为[#89769a]晶簇生物[]的生物有机体\n\n[lightgrey]它们占据了一处大型石墨矿脉\n\n[]摧毁巢穴是获取该矿脉的唯一途径
radiance.warn = [accent]晶簇生物将在[]{0}[]后发动攻击
radiance.crystalline = 该[accent]晶簇巢穴[]现已激活\n[accent]张力塔[]更擅长对付这些生物，因为它们相当耐久

