block.gr-drive-bay.name = 驱动机库
block.gr-drive-bay.description = 一个包含制造驱动所需蓝图的机械平台。\n驱动采用先进的液体打印技术制造。\n与塞普罗古老废墟中发现的废弃技术相似。

