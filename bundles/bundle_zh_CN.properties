block.gr-thermal-engine.description = [sky]特殊科技[]\n产生可观数量的电力，但其成本远超其收益。\n[red]- 极度易爆\n- 需要热力地形\n- 相当脆弱\n- 昂贵

block.gr-watt-reactor.name = 瓦特反应堆
block.gr-watt-reactor.description = 造价高昂，拥有惊人的电力输出，消耗水进行冷却。\n\n[scarlet]高优先级\n\n[salmon]- 造价高且易爆\n[accent]- 高电力输出(相当于40个光伏板)

#production
block.gr-combustion-barrel.name = 爆破桶
block.gr-combustion-barrel.description = 通过自爆以开采矿石，会自动将矿物运送至附近的存储建筑中。\n[accent]一次性建筑，[]放置后会在短时间内自动爆炸。\n\n[red]- 爆炸会伤害友方建筑

block.gr-dihydrogen-shaft.name = 水钻井
block.gr-dihydrogen-shaft.description = 消耗石墨从小行星中钻取水。

block.gr-heavy-excavator.name = 重型钻机

block.gr-hydro-drill.name = 机械钻机
block.gr-hydro-drill.description = 钻探矿物。

block.gr-industrial-borehole.name = 工业钻机
block.gr-industrial-borehole.description = 进阶水钻井，提取的水量远超水钻井。\n[sky]优先级：5[]\n[green]- 提取更大量的水\n- 不再需要石墨\n- 可超过100%效率\n[red]- 需要更多电力

block.gr-jet-rig.name = 气动钻机
block.gr-lead-melting-port.name = 熔化器

block.gr-melting-port.name = 熔化器
block.gr-melting-port.description = 可将多种金属熔化为液态。\n双击该建筑以切换配方。
 
block.gr-sand-strate.name = 沙层采掘机
block.gr-sand-strate.description = 从地面刮取沙粒。

block.gr-ton-crusher.name = 破碎钻机
block.gr-ton-crusher.description = 进阶型矿物钻机，可开取铍与钛。\n\n[grey]- 可以单击禁用\n[salmon]- 工作时承受更多伤害\n- 易爆

block.gr-silicon-melting-port.name = 熔化器

block.gr-scraping-rig.name = 刮采机
block.gr-scraping-rig.description = 从单位残骸中提取废料。\n[grey][i] - 废料：劣质金属，\n可熔炼为其他金属。[]

#turret
block.gr-deviate.name = 偏差
block.gr-deviate.description = 发射聚焦能量轨道炮。\n\n[green]- 高伤害，无视无敌帧\n[salmon]- 消耗水和电力[]

block.gr-disarray.name = 絮乱
block.gr-disarray.description = 发射爆破炮弹，造成范围伤害。

block.gr-launch-silo.name = 发射器
block.gr-launch-silo.description = 向所有方向发射霰弹式弹幕，可手动点击发射。\n\n[green]- 覆盖全方向\n- 无视无敌帧\n- 支持手动操作\n- 子弹具备追踪能力\n[salmon]- 射程小于子弹飞行距离\n- 弹药消耗大\n- 造价高\n- 消耗电力

block.gr-pressure.name = 压强
block.gr-pressure.description = 充能以发射冲击波，熔化范围内的敌人并修复建筑。

block.gr-pulverize.name = 粉碎
block.gr-pulverize.description = 向目标发射塑钢、玻璃分裂子弹，或者氧化物腐蚀子弹

block.gr-scar.name = 创痕

block.gr-star-struck.name = 星辉
block.gr-star-struck.description = 充能后开火。\n发射可穿透的激光，\n随后发射高速动能子弹。\n[green]- 动能子弹无视护甲\n- 极远射程\n[red]- 激光对护甲伤害：50%\n- 不精确

block.gr-tension.name = 张力
block.gr-tension.description = 向目标发射多枚追踪导弹。\n[green]- 较高击退

block.gr-torpedo.name = 鱼雷

block.gr-torrent.name = 激流
block.gr-torrent.description = 使用牵引光束将目标拉近。\n牵引光束会造成伤害并施加衰弱效果。\n[red]- 易爆

block.gr-triad.name = 穿轨

block.gr-trident.name = 三联
block.gr-trident.description = 造价高昂的炮塔，发射三连发高速子弹。\n基础子弹(铜)伤害充足并且无视无敌帧，也可使用多种弹药。\n\n[green]- 高弹速，高击退\n[salmon]- 不够精准，造价高\n\n[accent]- 无视无敌帧(铜)\n- 施加熔化效果(铅)

