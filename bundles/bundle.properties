sector.gr-fragmented-fix.description = Within the territory of the enemy.\nThe exogens are located on this planet.\nStart gathering resources to move on.\n\n[tan]Beating unlocks:[]\n - Dedrone Modifier\n - Delisted Modifier\n - Reinforced Modifier\n - Second lore chip

