#sector
sector.gr-gier-main.name = Gier [grey]<Asteroid Sector>[]
sector.gr-gier-main.description = A vast randomness of randomly generated terrain\n\n[red][!!Warning a crash can occur on certain devices!!]

sector.gr-vacant.name = Vacant
sector.gr-vacant.description = [accent]No enemies are present[]\n\nServes as the primary launching hub to other gier asteroids and a research center as well

sector.gr-fragmented-fix.name = Fragmented
sector.gr-fragmented-fix.description = Within the territory of the enemy.\nThe exogens are located on this planet.\nStart gathering resources to move on.\n\n[tan]Beating unlocks:[]\n - Dedrone Modifier\n - Delisted Modifier\n - Reinforced Modifier\n - Second lore chip

sector.gr-trench.name = Trench
sector.gr-trench.description = This sector receives very little light.\nThere multiple closed off sections of ore deposits.\n[accent]<Utilize drone facilies>

sector.gr-intercept.name = Intercept
sector.gr-intercept.description = A nearby enemy base is present. Silicon tech is usable here.\n\n[accent]Prepare defenses for the holdout[].

sector.gr-production-site.name = Production Site
sector.gr-production-site.description = [grey]<Optional Sector>[]\nNo threats within this sector\n\n [accent]Congrats you been hired![]\n[lightgrey]For further instructions launch to the sector

sector.gr-radiance.name = Radiance
sector.gr-radiance.description = A mining quarry located not far from the surface \n\n[accent]<A biological threat is present in this sector>\n<Utilize mend pylon>

sector.gr-aftermath.name = Aftermath
sector.gr-aftermath.description = Remnants of a production site\n\nA portion of the site still remains largely intact\n\n[red]Though the surviving core has losted it's capability to build any photon panels[]\n\n\n[accent]Defend the remaining photon panels and take out the remaining enemy forces

sector.gr-hedge.name = Hedge
sector.gr-hedge.description = [accent]This sector is located within Derium depth level and hence is quite dark[]\n\n[accent]Photon panels[] are replaced by [accent]Thermal engines[]\n\nAnd poccesses quite a hefty build cost\n\n [red]Avoid losing them as there also very explosive[]\n\n[lightgrey]Silicon tech is producable in this sector\n\n\n[accent]Utilize thermal engines and silicon tech to eradicate the large enemy attack force

sector.gr-plateau.name = Plateau
sector.gr-plateau.description = A small enemy stronghold is located here\n\nAn earlier design of the imprinter still remains intact, Fabricate units and lay waste to there stronghold

sector.gr-plateau.details = The base responsible for constructing units that where seen on intercept\n\nThe disrupter's production site is still unknown

sector.gr-encampment.name = Encampment
sector.gr-encampment.description = A long stretch that led to hedge\nA tiny blockade is exist here.\nPreventing further expansion destory them using turrets\n\n[accent]A large cluster of enemies are approaching\n\n\nObjective: Clear the waves as night fall slowly approaches

sector.gr-valley.name = Valley
sector.gr-valley.description = One of many exogen strongholds\n\nThe [sky]Exogen[] has constructed a large fortification here. Enemy unit production will also be backed up by the waves. \n\n\n[accent]Objective: Destroy all enemy cores in the sector\n- Build imprinters to produce more unit\n- A wave will be called when an exogen core is destroyed

sector.gr-upward.name = Upward
sector.gr-upward.description = A long stretch of land leading upwards towards an abandoned facility\n\nA nearby exogen scouting party has been sented to intercept our advance[accent]\n\nRepel the waves and continue upwards

