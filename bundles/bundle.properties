# Intercept
intercept.warn = [red]Warning[]\n Most of sector's resource deposits have been depleted.\n Protect the remaining deposits and get a foothold.

intercept.objective1 = [accent]Decays[] are approaching
intercept.objective2 = [accent]Disrupters[] are approaching

intercept.time = [red]Flow of enemies arriving in[] {0}
intercept.time2 = [accent]Sparks[lightgrey] will arrive in[] {0}
intercept.time3 = [accent]Barracades[lightgrey] will arrive in[] {0}
intercept.time4 = [red]Final wave will arrive in[] {0}

intercept.note2 = [accent]<Core: Facility>\nID#: 182\n\n[]Recent scans on enemy signitures suggests a base is nearby.\n\n[grey]Gen: 6\nLocation: Sector-61

production-site.timer = [accent]Time left:[] {0}
production-site.help = [grey]There are no enemies in this sector\n[]Produce the required resources in a set amount of time\n\n[red]Failing to do so will result in a lose\n[accent]Place a Hydro Drill to start\n\n[lightgrey]A reminder to check the blocks you could use before starting\n\n[grey](Mining is disabled till you start)

radiance.note = A biological oragnism known as the [#89769a]Crystalline critters[] is present in this sector\n\n[lightgrey]They taken hold of a large graphite deposit\n\n[]killing the hive is the only way to gain access to the deposit
radiance.warn = [accent]Crystalline critter attacks in[] {0}
radiance.crystalline = This [accent]Crystalline hive[] is active now \n[accent]Tension[] is better at dealing with the critter since they're quite durable

aftermath.warn =  This site has recently fallen due to frequent attacks\n\nThough a portion of the site still remains largely intact and operation\n\n[red]The core was damaged and losted the capabilities to construct a photon panel\n\n[accent]Protect the remaining photon panels and destroy whats left of there forces

hedge.warn = [red]>>Depth Warning<<[]\n\nThis sector is located at [accent]Derium[]\nlevel ([lightgrey]-12KM - Sea Level[])\n\n[accent]Photon panels[] are not viable sources of\npower at such depths\n\nAnd it's been switched it out in favor of\nthe [accent]Thermal engine[]\n\n[accent]Thermal Engines[] was this site's original\nsource of power\n([lightgray]Prior to the incident[])\n\n[red]Thermal Engines are quite expensive\navoid losing it[]

valley.imprinter-note = [accent]Imprinters[] allow for the construction of even more units\n\n[accent]Freight constructor[] and [accent]Fissure Amalgam[] will be required to produce the blocks needed for the unit recipe.\n\n[grey][ Check block info (?) to see ]

upward.warn = [red][The depths are boiling...][grey]\n\nTime between waves reduced significantly[]
upward.info = [accent]This area is prone to a phenomenon known as depth boiling\n\n[]The exogen will be forced to rush there attack forces to us before they boil Some enemies within there convoy are able repair other damaged units\n\n[accent]Make the most of your preperation time and don't hold back[]

