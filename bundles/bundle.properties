sector.gr-radiance.description = A mining quarry located not far from the surface \n\n[accent]<A biological threat is present in this sector>\n<Utilize mend pylon>

sector.gr-aftermath.name = Aftermath
sector.gr-aftermath.description = Remnants of a production site\n\nA portion of the site still remains largely intact\n\n[red]Though the surviving core has losted it's capability to build any photon panels[]\n\n\n[accent]Defend the remaining photon panels and take out the remaining enemy forces

sector.gr-hedge.name = Hedge
sector.gr-hedge.description = [accent)This sector is located within Derium depth level and hence is quite dark[]\n\n[accent]Photon panels[] are replaced by [accent]Thermal engines[]\n\nAnd poccesses quite a hefty build cost\n\n [red]Avoid losing them as there also very explosive[]\n\n[lightgrey]Silicon tech is producable in this sector\n\n\n[accent]Utilize thermal engines and silicon tech to eradicate the large enemy attack force

