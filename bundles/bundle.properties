sector.gr-trench.description = This sector receives very little light.\nThere multiple closed off sections of ore deposits.\n[accent]<Utilize drone facilies>

sector.gr-intercept.name = Intercept
sector.gr-intercept.description = A nearby enemy base is present. Silicon tech is usable here.\n\n[accent]Prepare defenses for the holdout[].

sector.gr-production-site.name = Production Site
sector.gr-production-site.description = [grey]<Optional Sector>[]\nNo threats within this sector\n\n [accent]Congrats you been hired![]\n[lightgrey]For further instructions launch to the sector

