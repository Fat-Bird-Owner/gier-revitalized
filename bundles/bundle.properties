# Modifiers

Modifiers.Brief: Increases the time between [accent]Waves[] by 15 seconds. Enemy health multiplier increased by [accent]5%[]
Modifiers.Decay: [accent]Deconstruction Refund[] an extra 10% but [accent]Build speed[] is reduce by 25%
Modifiers.Trench: Fog of war is enabled. [accent]Reserve[] gain increases by 2
Modifiers.Ignition: [accent]Fire[] is enabled. [accent]Reserve[] gain increases by 1
Modifiers.Abyss: Static fog is enabled. [accent]Reserve[] gain increases by 1
Modifiers.Hatred: [accent]Unit[] and [accent]Turret[] damage increased by 10%
Modifiers.Set: [accent]DragMultiplier[] increased by 10%. [accent]Reserve[] gain increases by 1
Modifiers.Depart: [accent]Ghost[] blocks are disabled. [accent]Reserve[] gain increases by 1
Modifiers.Crumble: Blocks [accent]Health multiplier[] decreased by 10%. [accent]Buildspeed[] increased by 0.25x
Modifiers.Arms: Blocks [accent]Health multiplier[] and [accent]Build cost[] increased by 10%
